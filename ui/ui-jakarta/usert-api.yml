openapi: 3.1.0
info:
  title: CRIMSy Test API
  description: Simple API to manage users and roles for now
  version: 1.0.0
  
servers:
  - url: http://localhost:8080/api
    description: Local development server
      
      
paths:
  /login:
    post:
      summary: User login to get the Beare token
      operationId: loginUser
      requestBody:
        description: User login credentials
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
              required:
                - login
                - password
      responses:
        '200':
          description: Successful login with Bearer token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    format: uuid
        '401':
          description: Unauthorized
        '400':
          description: Bad request (invalid input)
          
  /usersT:
    get:
      summary: List all users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserT'

    post:
      summary: Create a new user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserT'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserT'  
                
  /usersT/{id}:
    get:
      summary: Get a user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserT'
        '404':
          description: User not found
  
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Random Token
        
  schemas:
    MemberT:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        node:
          type: string
          description: Node ID (UUID or identifier)
        subSystemType:
          type: string
        subSystemData:
          type: string
        modified:
          type: string
          format: date-time
      
    UserT:
      allOf:
        - $ref: '#/components/schemas/MemberT'
        - type: object
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
            login:
              type: string
            password:
              type: string
            shortcut:
              type: string