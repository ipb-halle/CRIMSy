openapi: 3.0.3
info:
  title: CRIMSy API
  version: 1.0.0

paths:
  /members/{id}:
    get:
      summary: Get a member by ID
      operationId: getMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '404':
          description: Not found
  /usersT:
    get:
      summary: Get all users
      operationId: getUsers
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserT'
    post:
      summary: Create a new user
      operationId: createUser
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserT'
                
  /usersT/{id}:
    get:
      summary: Get a user by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          description: ID of the user
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserT'
                
  /usersT/login:
    post:
      summary: Login with credentials
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserT'
        '401':
          description: Invalid login credentials
   

components:
  schemas:

    Member:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        node:
          $ref: '#/components/schemas/Node'
        subSystemType:
          $ref: '#/components/schemas/AdmissionSubSystemType'
        subSystemData:
          type: string
        modified:
          type: string
          format: date-time
        group:
          type: boolean
          description: True if this member is a group
        user:
          type: boolean
          description: True if this member is a user

    Node:
      type: object
      properties:
        id:
          type: string
          format: uuid
        baseUrl:
          type: string
        institution:
          type: string
        local:
          type: boolean
        publicNode:
          type: boolean
        version:
          type: string
  
    AdmissionSubSystemType:
      type: string
      description: "Subsystem managing users/groups: BUILTIN, LOCAL, LDAP, LBAC_REMOTE."
      enum:
        - BUILTIN
        - LOCAL
        - LDAP
        - LBAC_REMOTE
      x-enum-index:
        BUILTIN: 0
        LOCAL: 1
        LDAP: 2
        LBAC_REMOTE: 3
