openapi: 3.0.3
info:
  title: CRIMSy API
  version: 1.0.0

security:
  - SessionKeyAuthentification: []

paths:
  /auth/logout:
    post:
      tags:
        - Authentication
        - Logout
      summary: Logout the current user
      description: Invalidates the user's session and deletes the token from database.
      operationId: logout
      responses:
        '200':
          description: Successfuly loged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful
        '401':
          description: Unauthorized request (invalid or missing token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Inauthorized
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid request
   
  /auth/login:
    post:
      tags:
        - Login
        - Authentication        
      summary: Log in a user
      description: Authenticates a user with the provided login credentials.
      operationId: login
      security: []
      requestBody:
        description: User login credentials
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized login attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login failed
        '400':
          description: Invalid input or missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid request format
 
  /usersList:
    get:
      summary: Get list of users
      description: Returns all users for admin, or own info for non-admin users
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserT'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /role:
    get:
      tags:
        - Authorization
        - Role
      summary: Get role and group information of the current user
      description: |
        Returns the authenticated user's username, group memberships,
        and whether the user belongs to the Admin Group.
      operationId: getRoleInfo
      responses:
        '200':
          description: Role and group information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid token
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User not found

components:
  securitySchemes:
    SessionKeyAuthentification:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Session key authentication using a custom header.
       
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: The username
          example: johndoe
        password:
          type: string
          description: The password
          example: password123
  
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        username:
          type: string
        token:
          type: string
          description: "Bearer token for authentication"
          example: "b7fe38b9-37r4-3i9o-0e92-45zh6usd893ki4u"
        expiresInSeconds:
          type: integer
          example: 60
          description: Session validity duration in seconds
        roles:
          type: array
          items:
            type: string
          description: List of roles assigned to the user
        groups:
          type: array
          items:
            type: string
          description: List of groups the user belongs to
        
    UserT:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        name:
          type: string
        membertype:
          type: string

    RoleResponse:
      type: object
      properties:
        username:
          type: string
          example: johndoe
        groups:
          type: array
          items:
            type: string
          example:
            - Users
            - Admin Group
        admin:
          type: boolean
          description: Indicates whether the user belongs to the Admin Group
          example: true
   