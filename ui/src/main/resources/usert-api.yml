openapi: 3.0.3
info:
  title: CRIMSy API
  version: 1.0.0
  description: |
    API specification for managing research materials, users, authentication,
    search capabilities, administration workflows, and audit logging.
    Designed for integration with React frontends and Java/Jakarta backend services.

servers:
  - url: https://compchem17.ipb-halle.de/ui/rest
    description: Production API server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: User administration and profile management
  - name: Materials
    description: Material registry and metadata management
  - name: MME
    description: Material management environment system overview
  - name: Search
    description: Advanced multi-domain search functionality
  - name: Admin
    description: Administrative operations for system management
  - name: Export
    description: Data export in various formats
  - name: AuditLogs
    description: System audit logs and activity tracking

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user and create session
      description: |
        Validates user credentials and returns a session token.
        The token must be included in subsequent requests via the Authorization header.
      operationId: login
      security: []
      requestBody:
        description: User login credentials
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Unauthorized login attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input or missing parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current user & end user session
      description: Invalidates the user's session and deletes the token from database.
      operationId: logout
      responses:
        "200":
          description: Successfully logged out
        "401":
          description: Unauthorized request (invalid or missing token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags:
        - Auth
      summary: Retrieve authenticated user
      description: |
        Returns the authenticated user's role information and group memberships.
        This endpoint is used by the frontend to determine access permissions.
      operationId: authMeGet
      responses:
        "200":
          description: Role and permission information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "401":
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mme:
    get:
      tags:
        - MME
      summary: System overview
      description: Returns high-level system information.
      responses:
        "200":
          description: System information

  /audit/logs:
    get:
      tags:
        - AuditLogs
      summary: Retrieve audit logs
      description: |
        Returns system activity logs for compliance and debugging.
        Logs include user actions and administrative events.
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: |
        Authentication via Bearer token.
        The token is obtained from /auth/login and sent as:
        Authorization: Bearer <token>

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: User login name
          example: johndoe
        password:
          type: string
          description: User password
          example: password123

    AuthToken:
      type: object
      properties:
        token:
          type: string
          description: Token
        expiresInSeconds:
          type: integer
          description: Session validity duration in seconds

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        role:
          type: string

    LogoutResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Logged out successfully"

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          type: string

    RoleResponse:
      type: object
      required:
        - username
        - groups
        - admin
      properties:
        username:
          type: string
          example: johndoe
        groups:
          type: array
          items:
            type: string
          example:
            - Users
            - Admin Group
        admin:
          type: boolean
          description: Indicates whether the user belongs to the Admin Group
          example: true
    
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        action:
          type: string
        entity:
          type: string
        timestamp:
          type: string
          format: date-time