openapi: 3.0.3
info:
  title: CRIMSy API
  version: 1.0.0

paths:
  
  /loginTest:
    post:
      summary: Log in a user
      description: Autheticates a user with the provided login credentials.
      operationId : loginTest
      requestBody:
        description: User login credentials
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  description: The username
                  example: johndoe
                password:
                  type: string
                  description: The password
                  example: password123
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login succeeded
        '401':
          description: Unauthorized login attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login failed
        '400':
          description: Invalid input or missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid request format                  