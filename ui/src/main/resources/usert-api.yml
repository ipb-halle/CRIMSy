openapi: 3.0.0
info:
  title: CRIMSy API
  version: 0.0.1

paths:
  /login:
    post:
      summary: Login with username and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Successful login
          headers:
            Authorization:
              description: Bearer token (optional)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        username:
          type: string
